name: Release

# 打 tag 即发版，例如：git tag v2.0.0 && git push origin v2.0.0
# 自动编译 5 平台静态二进制并挂到 GitHub Release 上。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, suffix: '' }
          - { goos: linux, goarch: arm64, suffix: '' }
          - { goos: windows, goarch: amd64, suffix: '.exe' }
          - { goos: darwin, goarch: amd64, suffix: '' }
          - { goos: darwin, goarch: arm64, suffix: '' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" \
            -o derp-scan-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: derp-scan-*
